[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=44

[Output]
Format=directory
OutputDirectory=/var/lib/machines
Output=sandbox

[Content]
Packages=
	bash
	coreutils
	dnf
	fedora-release
	shadow-utils
	sudo
	systemd
	systemd-networkd
	util-linux
WithRecommends=yes
RootPassword=hashed:
MachineId=random
Bootable=no

[Runtime]
Machine=sandbox
